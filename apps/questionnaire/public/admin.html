<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TatvaOps Admin Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b1120;
      min-height: 100vh;
      color: rgba(226, 232, 240, 0.9);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      margin-bottom: 30px;
    }

    h1 {
      font-size: 1.8rem;
      color: #5eead4;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 40px rgba(79, 70, 229, 0.2);
      border-color: rgba(79, 70, 229, 0.4);
    }

    .stat-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .stat-label {
      font-size: 0.9rem;
      color: rgba(148, 163, 184, 0.85);
      margin-top: 8px;
    }

    .filters {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 10px 20px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.55);
      color: rgba(226, 232, 240, 0.85);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
    }

    .filter-btn:hover {
      border-color: #4f46e5;
      background: rgba(79, 70, 229, 0.12);
      color: #c7d2fe;
    }

    .filter-btn.active {
      border-color: #4f46e5;
      background: rgba(79, 70, 229, 0.18);
      color: #e0e7ff;
    }

    .sessions-table {
      background: rgba(15, 23, 42, 0.55);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 16px 20px;
      text-align: left;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }

    th {
      background: rgba(17, 25, 40, 0.95);
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgba(148, 163, 184, 0.85);
    }

    tr:hover {
      background: rgba(79, 70, 229, 0.08);
    }

    .status-badge {
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .status-collecting {
      background: rgba(250, 204, 21, 0.15);
      color: #facc15;
    }

    .status-completed {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }

    .status-new {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
    }

    .channel-badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
    }

    .channel-whatsapp {
      background: rgba(37, 211, 102, 0.15);
      color: #25d366;
    }

    .channel-web {
      background: rgba(79, 70, 229, 0.15);
      color: #a78bfa;
    }

    .view-btn {
      padding: 8px 16px;
      background: #4f46e5;
      border: none;
      border-radius: 999px;
      color: white;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .view-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #0f172a;
      border-radius: 20px;
      max-width: 800px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: 0 24px 45px rgba(15, 23, 42, 0.55);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    }

    .modal-header h2 {
      color: #5eead4;
      font-size: 1.2rem;
    }

    .modal-close {
      background: none;
      border: none;
      color: rgba(226, 232, 240, 0.8);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .modal-body {
      padding: 20px;
    }

    .transcript {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .message.user {
      align-self: flex-end;
      background: #4f46e5;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: #111827;
      color: rgba(226, 232, 240, 0.95);
      border-bottom-left-radius: 4px;
    }

    .params-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .param-item {
      background: rgba(15, 23, 42, 0.55);
      padding: 12px;
      border-radius: 8px;
    }

    .param-label {
      font-size: 0.75rem;
      color: rgba(148, 163, 184, 0.8);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .param-value {
      font-weight: 500;
      color: #38bdf8;
      font-size: 0.9rem;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: rgba(148, 163, 184, 0.6);
    }

    .refresh-btn {
      padding: 8px 16px;
      background: #4f46e5;
      border: none;
      border-radius: 999px;
      color: white;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .refresh-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>🏠 TatvaOps Admin Dashboard</h1>
      <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
    </header>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-value" id="statTotal">-</div>
        <div class="stat-label">Total Sessions</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statWhatsApp">-</div>
        <div class="stat-label">WhatsApp Chats</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statCollecting">-</div>
        <div class="stat-label">In Progress</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statCompleted">-</div>
        <div class="stat-label">Completed</div>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="whatsapp">WhatsApp</button>
      <button class="filter-btn" data-filter="web">Web</button>
    </div>

    <div class="sessions-table">
      <table>
        <thead>
          <tr>
            <th>Phone / User</th>
            <th>Channel</th>
            <th>Status</th>
            <th>Data Points</th>
            <th>Messages</th>
            <th>Last Activity</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="sessionsBody">
          <tr>
            <td colspan="7" class="empty-state">Loading sessions...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="modal" id="sessionModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Session Details</h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    let allSessions = [];
    let currentFilter = 'all';

    async function loadData() {
      try {
        // Load stats
        const statsRes = await fetch('/admin/stats');
        const stats = await statsRes.json();

        document.getElementById('statTotal').textContent = stats.total;
        document.getElementById('statWhatsApp').textContent = stats.byChannel.whatsapp;
        document.getElementById('statCollecting').textContent = stats.byStatus.collecting;
        document.getElementById('statCompleted').textContent = stats.byStatus.completed;

        // Load sessions
        const sessionsRes = await fetch('/admin/sessions');
        const data = await sessionsRes.json();
        allSessions = data.sessions;

        renderSessions();
      } catch (err) {
        console.error('Failed to load data:', err);
        document.getElementById('sessionsBody').innerHTML =
          '<tr><td colspan="7" class="empty-state">Failed to load data. Is the server running?</td></tr>';
      }
    }

    function renderSessions() {
      const filtered = currentFilter === 'all'
        ? allSessions
        : allSessions.filter(s => s.channel === currentFilter);

      if (filtered.length === 0) {
        document.getElementById('sessionsBody').innerHTML =
          '<tr><td colspan="7" class="empty-state">No sessions found</td></tr>';
        return;
      }

      document.getElementById('sessionsBody').innerHTML = filtered.map(session => `
        <tr>
          <td>
            <div style="display: flex; flex-direction: column; gap: 2px;">
              <span style="font-weight: 600; color: #38bdf8;">${session.channel === 'whatsapp' ? '📱 ' : ''}${formatPhone(session.userRef)}</span>
              ${session.status === 'completed' ? '<span style="font-size: 0.7rem; color: #4ade80;">✓ Completed</span>' : ''}
            </div>
          </td>
          <td><span class="channel-badge channel-${session.channel}">${session.channel}</span></td>
          <td><span class="status-badge status-${session.status}">${session.status}</span></td>
          <td>${session.collectedParams}</td>
          <td>${session.totalMessages}</td>
          <td>${formatTime(session.lastActivity)}</td>
          <td><button class="view-btn" onclick="viewSession('${session.id}')">View</button></td>
        </tr>
      `).join('');
    }

    function formatTime(dateStr) {
      const date = new Date(dateStr);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);

      if (diffMins < 1) return 'Just now';
      if (diffMins < 60) return `${diffMins}m ago`;
      if (diffMins < 1440) return `${Math.floor(diffMins / 60)}h ago`;
      return date.toLocaleDateString();
    }

    function formatPhone(userRef) {
      if (!userRef) return 'Unknown';
      // Remove whatsapp: prefix if present
      let phone = userRef.replace(/^whatsapp:/i, '').trim();
      // Format phone number for display
      if (phone.startsWith('+')) {
        // International format - show last 10 digits nicely
        const digits = phone.replace(/\D/g, '');
        if (digits.length >= 10) {
          const last10 = digits.slice(-10);
          return `+${digits.slice(0, -10)} ${last10.slice(0,5)} ${last10.slice(5)}`;
        }
      }
      return phone;
    }

    async function viewSession(id) {
      try {
        const res = await fetch(`/admin/sessions/${id}`);
        const data = await res.json();

        document.getElementById('modalTitle').innerHTML = `📱 ${formatPhone(data.userRef)} ${data.status === 'completed' ? '<span style="color: #4ade80; font-size: 0.8rem; margin-left: 8px;">✓ Completed</span>' : ''}`;

        // Project Summary Section - prefer 6-point summary if available
        const summaryToShow = data.sixPointSummary || data.projectSummary;
        const hasSummary = summaryToShow && Object.keys(summaryToShow).length > 0;
        
        let summaryHtml = `
          <div style="margin-bottom: 24px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
              <h3 style="color: #5eead4; font-size: 1rem; text-transform: uppercase;">📋 Project Summary</h3>
              <button class="view-btn" id="generateSummaryBtn" onclick="generateSummary('${id}')" style="font-size: 0.8rem;">
                ${hasSummary ? '🔄 Regenerate' : '✨ Generate Summary'}
              </button>
            </div>
            <div id="summaryContent">
              ${hasSummary ? renderSummary(summaryToShow) : '<p style="color: rgba(148, 163, 184, 0.6);">No summary generated yet. Click "Generate Summary" to create one.</p>'}
            </div>
          </div>
        `;

        let paramsHtml = '';
        if (data.parameters && Object.keys(data.parameters).length > 0) {
          paramsHtml = '<h3 style="margin-bottom: 12px; color: #5eead4; font-size: 1rem; text-transform: uppercase;">📊 Collected Data</h3><div class="params-grid">';
          for (const [key, val] of Object.entries(data.parameters)) {
            const displayVal = typeof val === 'object' ? (val.value || JSON.stringify(val)) : val;
            paramsHtml += `
              <div class="param-item">
                <div class="param-label">${key}</div>
                <div class="param-value">${displayVal}</div>
              </div>
            `;
          }
          paramsHtml += '</div>';
        }

        let transcriptHtml = '<h3 style="margin: 20px 0 12px; color: #5eead4; font-size: 1rem; text-transform: uppercase;">💬 Conversation</h3><div class="transcript">';
        if (data.transcript && data.transcript.length > 0) {
          transcriptHtml += data.transcript.map(msg => `
            <div class="message ${msg.role}">${msg.text}</div>
          `).join('');
        } else {
          transcriptHtml += '<p style="color: rgba(148, 163, 184, 0.6);">No messages yet</p>';
        }
        transcriptHtml += '</div>';

        document.getElementById('modalBody').innerHTML = summaryHtml + paramsHtml + transcriptHtml;
        document.getElementById('sessionModal').classList.add('active');
      } catch (err) {
        console.error('Failed to load session:', err);
        alert('Failed to load session details');
      }
    }

    function renderSummary(summary) {
      if (!summary) return '<p style="color: rgba(148, 163, 184, 0.6);">No summary data available.</p>';
      
      // Support both old format (projectOverview) and new 6-point format (clientProfile)
      const isNewFormat = summary.clientProfile || summary.projectScope;
      
      const sections = isNewFormat ? [
        { key: 'clientProfile', label: 'CLIENT PROFILE', icon: '👤' },
        { key: 'projectScope', label: 'PROJECT SCOPE', icon: '🎯' },
        { key: 'keyRequirements', label: 'KEY REQUIREMENTS', icon: '📋' },
        { key: 'budgetTimeline', label: 'BUDGET & TIMELINE', icon: '💰' },
        { key: 'conversationInsights', label: 'CONVERSATION INSIGHTS', icon: '💬' },
        { key: 'nextSteps', label: 'NEXT STEPS', icon: '📞' },
      ] : [
        { key: 'projectOverview', label: 'PROJECT OVERVIEW', icon: '🎯' },
        { key: 'scopeOfWork', label: 'SCOPE OF WORK', icon: '📝' },
        { key: 'clientRequirements', label: 'CLIENT REQUIREMENTS', icon: '👤' },
        { key: 'technicalSpecs', label: 'TECHNICAL SPECS', icon: '⚙️' },
        { key: 'timeline', label: 'TIMELINE', icon: '📅' },
        { key: 'specialConsiderations', label: 'SPECIAL CONSIDERATIONS', icon: '⚡' },
        { key: 'estimatedScope', label: 'ESTIMATED SCOPE', icon: '📐' },
      ];

      const renderedSections = sections
        .filter(s => summary[s.key] && summary[s.key] !== '--' && summary[s.key].trim() !== '')
        .map(s => `
          <div style="margin-bottom: 16px; border-bottom: 1px dashed rgba(148, 163, 184, 0.15); padding-bottom: 12px;">
            <div style="font-size: 0.75rem; color: #38bdf8; margin-bottom: 6px; font-weight: 600; text-transform: uppercase;">${s.icon} ${s.label}</div>
            <div style="color: rgba(226, 232, 240, 0.9); line-height: 1.6; font-size: 0.95rem;">${summary[s.key]}</div>
          </div>
        `).join('');

      if (!renderedSections) {
        return '<p style="color: rgba(148, 163, 184, 0.6);">Summary generated but no content available. Try regenerating.</p>';
      }

      return `
        <div style="background: rgba(15, 23, 42, 0.55); border-radius: 12px; padding: 18px; border: 1px solid rgba(148, 163, 184, 0.18);">
          ${renderedSections}
          ${summary.moodSummary ? `
            <div style="margin-bottom: 16px; border-bottom: 1px dashed rgba(148, 163, 184, 0.15); padding-bottom: 12px;">
              <div style="font-size: 0.75rem; color: #a78bfa; margin-bottom: 6px; font-weight: 600; text-transform: uppercase;">🎭 MOOD ANALYSIS</div>
              <div style="color: rgba(226, 232, 240, 0.9); line-height: 1.6; font-size: 0.95rem;">${summary.moodSummary}</div>
            </div>
          ` : ''}
          ${summary.generatedAt ? `<div style="font-size: 0.7rem; color: rgba(148, 163, 184, 0.6); margin-top: 12px; text-align: right;">Generated: ${new Date(summary.generatedAt).toLocaleString()}</div>` : ''}
        </div>
      `;
    }

    async function generateSummary(sessionId) {
      const btn = document.getElementById('generateSummaryBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = '⏳ Generating...';
      btn.disabled = true;

      try {
        // Try 6-point summary first (newer, more comprehensive)
        let res = await fetch(`/admin/sessions/${sessionId}/generate-six-point-summary`, { method: 'POST' });
        let data = await res.json();

        if (data.status === 'success' && data.sixPointSummary) {
          document.getElementById('summaryContent').innerHTML = renderSummary(data.sixPointSummary);
          btn.innerHTML = '🔄 Regenerate';
        } else {
          // Fallback to old summary endpoint
          res = await fetch(`/admin/sessions/${sessionId}/generate-summary`, { method: 'POST' });
          data = await res.json();
          
          if (data.status === 'success') {
            document.getElementById('summaryContent').innerHTML = renderSummary(data.summary);
            btn.innerHTML = '🔄 Regenerate';
          } else {
            alert('Failed to generate summary: ' + (data.error || 'Unknown error'));
            btn.innerHTML = originalText;
          }
        }
      } catch (err) {
        console.error('Failed to generate summary:', err);
        alert('Failed to generate summary');
        btn.innerHTML = originalText;
      }

      btn.disabled = false;
    }

    function closeModal() {
      document.getElementById('sessionModal').classList.remove('active');
    }

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderSessions();
      });
    });

    // Close modal on outside click
    document.getElementById('sessionModal').addEventListener('click', (e) => {
      if (e.target.id === 'sessionModal') closeModal();
    });

    // Load data on page load
    loadData();

    // Auto-refresh every 30 seconds
    setInterval(loadData, 30000);
  </script>
</body>

</html>
