name: Build and Deploy Quest Characters

on:
  push:
    branches:
      - main
  workflow_dispatch: # Manual trigger

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: quest-characters
  SERVICE_NAME: quest-characters

jobs:
  build-and-deploy:
    name: Build Docker Image and Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PRAMOD_TATVA }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PRAMOD_TATVA }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Build, tag, and push Docker image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "Building Docker image..."
        docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
        
        echo "Pushing to ECR..."
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
        docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
        
        echo "✅ Image pushed successfully!"
        echo "Image: $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest"
    
    - name: Deploy to EC2 (Optional)
      if: github.ref == 'refs/heads/main'
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        echo "$SSH_PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem
        
        ssh -i private_key.pem -o StrictHostKeyChecking=no ec2-user@$EC2_HOST << 'ENDSSH'
          cd /opt/tatvaops
          
          # Login to ECR
          $(aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }})
          
          # Pull latest image for this service
          docker-compose pull ${{ env.SERVICE_NAME }}
          
          # Restart only this service
          docker-compose up -d ${{ env.SERVICE_NAME }}
          
          echo "✅ ${{ env.SERVICE_NAME }} deployed successfully!"
        ENDSSH
        
        rm -f private_key.pem
    
    - name: Deployment Summary
      run: |
        echo "### Deployment Complete! 🚀" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Service**: ${{ env.SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
